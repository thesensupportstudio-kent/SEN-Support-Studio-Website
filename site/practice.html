<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice What We've Learnt | SEN Support Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=1785424300">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1784668545">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=1784668545">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png?v=1784668545">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1784668545">
</head>
<body>

<div class="practice-app" id="practice-app">
  <header class="practice-topbar">
    <a href="client-portal.html" class="practice-back">&larr; My Account</a>
    <span class="practice-topbar-title">Practice What We've Learnt</span>
  </header>

  <main class="practice-main">
    <p id="practice-loading" class="practice-status">Loading…</p>
    <div id="practice-error" class="practice-status practice-status-error hidden"></div>
    <div id="practice-empty" class="practice-status hidden">Nothing added yet - ask your practitioner to add some words or letter sounds after your next session.</div>

    <div id="practice-pdfs" class="practice-pdfs hidden">
      <h2 class="practice-pdfs-title">Flashcards to print</h2>
      <div id="practice-pdfs-list" class="practice-pdfs-list"></div>
    </div>

    <div id="practice-content" class="practice-content hidden">
      <section id="flashcards-view" class="practice-view">
        <p class="practice-progress" id="flashcard-progress"></p>
        <div class="practice-card" id="flashcard" tabindex="0" role="button" aria-label="Tap to reveal the answer"></div>
        <p class="practice-hint">Tap the card to reveal the answer</p>
        <div class="practice-controls">
          <button type="button" class="practice-btn practice-btn-ghost" id="flashcard-prev-btn">&larr; Previous</button>
          <button type="button" class="practice-btn practice-btn-ghost" id="flashcard-shuffle-btn">Shuffle</button>
          <button type="button" class="practice-btn" id="flashcard-next-btn">Next &rarr;</button>
        </div>
      </section>
    </div>

    <p class="practice-footnote">Something not right? <a href="contact.html">Get in touch</a>.</p>
  </main>
</div>

<script src="js/practice.js?v=1785424300"></script>
</body>
</html>
